<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A2B2F">
<title>Class Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app. Top bar, scrolling body, two bottom tabs. Vermilion accent like a dojo hanko stamp. */
  --bg:#E3E3E5; --surface:#F6F6F7; --ink:#1D1E21; --muted:#5E6067; --line:#CDCDD2;
  --bar:#2A2B2F; --bar-ink:#F3F3F4; --bar-muted:#B6B8BE;
  --accent:#C21F1D; --accent-ink:#FFFFFF; --accent-soft:#F4D9D7;
  --ok:#1B7A4D; --ok-soft:#DCF2E5; --warn:#8F5600; --warn-soft:#FBEDCB; --bad:#B3261E; --bad-soft:#FBE2DF;
  --belt-white:#F4F4F2; --belt-yellow:#F2C400; --belt-orange:#EE7F1A; --belt-green:#2E9B4F; --belt-blue:#2C6BD0; --belt-brown:#7A4B2A; --belt-black:#1B1B1B;
  --font-display:"Shippori Mincho",Georgia,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --surface:#202124; --ink:#EDEDEF; --muted:#9C9EA5; --line:#35373C; --bar:#0B0B0C; --bar-ink:#F3F3F4; --bar-muted:#9C9EA5;
    --accent:#E5493F; --accent-ink:#1A0907; --accent-soft:#3D1D1B;
    --ok:#52C98E; --ok-soft:#143022; --warn:#E8B64F; --warn-soft:#352A10; --bad:#FF8379; --bad-soft:#3B1B19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#202124; --ink:#EDEDEF; --muted:#9C9EA5; --line:#35373C; --bar:#0B0B0C; --bar-ink:#F3F3F4; --bar-muted:#9C9EA5;
  --accent:#E5493F; --accent-ink:#1A0907; --accent-soft:#3D1D1B;
  --ok:#52C98E; --ok-soft:#143022; --warn:#E8B64F; --warn-soft:#352A10; --bad:#FF8379; --bad-soft:#3B1B19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;background:var(--bar);color:var(--bar-ink)}
.top .grow{flex:1;min-width:0}
.title{font:800 22px/1.15 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.subtitle{color:var(--bar-muted);font-size:13px;margin-top:2px}
.stamp{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px/1 var(--font-display);flex:none}
.sync{font-size:12px;color:var(--bar-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.saved i{background:var(--ok)} .sync.saving i{background:var(--warn)}
#main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats>div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.stats small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.stats b{font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:56px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font:800 17px/1.2 var(--font-display)}
.sec-h span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}

.bcard{display:flex;align-items:stretch;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.bcard .bar{width:6px;background:var(--line);flex:none}
.bcard.todo .bar{background:var(--accent)} .bcard.done .bar{background:var(--ok)}
.bcard .body{padding:12px 14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bcard .name{font:800 18px/1.2 var(--font-display)}
.bcard .meta{color:var(--muted);font-size:13px}
.bcard .go{align-self:center;padding-right:12px;color:var(--muted);font-size:22px}
.daychips{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.daychips b{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--bg);color:var(--muted)}
.daychips b.on{background:var(--accent-soft);color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;min-height:32px}
.mini.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;font-size:20px;line-height:1;flex:none}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:9px 6px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:6px;border-radius:8px}
.row .name{font-weight:600}
.row .sub{color:var(--muted);font-size:13px}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.list{display:flex;flex-direction:column;gap:8px}
.belt{width:10px;height:36px;border-radius:3px;background:var(--b,#ccc);border:1px solid var(--muted);flex:none}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.muted{background:var(--bg);color:var(--muted)}

.datebar{display:flex;gap:8px;align-items:center}
.datebar label{flex:1;position:relative}
.datebar input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;text-align:center;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .stack{display:flex;flex-direction:column;gap:10px}

.att{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 6px;min-height:54px}
.att .box{margin-left:auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:transparent;flex:none}
.att[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.att[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.att .grow{flex:1;min-width:0}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.count{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.count small{font-weight:500;color:var(--muted)}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:12px;min-width:120px}
.grid td.y{color:var(--ok);font-weight:800} .grid td.n{color:var(--muted)}
.grid th small{display:block;font-weight:500;color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{color:var(--muted);font-weight:600;font-size:13px}
.tile b{display:block;font:800 24px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tile.owe b{color:var(--accent)}
.tr-h{display:flex;align-items:center;gap:10px}
.tr-h .grow{flex:1;min-width:0}
.ledger{display:flex;flex-direction:column;margin-top:8px}
.ledger .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ledger .li .grow{flex:1;min-width:0}
.money{font-weight:700;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgb(10 12 16 / .55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{font:800 20px/1.2 var(--font-display)}
.sheet .actions{display:flex;gap:10px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.daypick span{display:block;min-width:46px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px}
.daypick input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero>*{background:var(--surface);padding:10px 10px 12px;border:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px}
.hero small{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
.hero b{font:800 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero b span{font-size:14px;color:var(--muted)}
.hero b.hot{color:var(--accent)}
@media (max-width:380px){.hero{grid-template-columns:1fr 1fr}}
.steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.steps b{font-weight:700}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.top{border-bottom:3px solid var(--accent)}
.card,.bcard,.row,.tile{box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.tabs button[aria-current="page"]{position:relative}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--line);overflow:hidden}
.av.init{background:var(--accent-soft);color:var(--accent);font-weight:800}
.byrow{display:flex;gap:10px;align-items:flex-end}
.byrow .grow{flex:1;min-width:0}
.photorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filebtn{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sr-file{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.datagrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:no-preference){.bcard,.att,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="scrim" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants and helpers ---------- */
var KEY='karate-attendance-v1';
var BELTS=[['white','White'],['yellow','Yellow'],['orange','Orange'],['green','Green'],['blue','Blue'],['brown','Brown'],['black','Black']];
var PLANS={monthly:{label:'Monthly',months:1,fee:500},annual:{label:'Annual',months:12,fee:5000}};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return ymd(new Date())}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)}
function shiftMonth(m,n){return addMonths(m+'-01',n).slice(0,7)}
function fmt(s,o){return parse(s).toLocaleDateString('en-IN',o||{day:'numeric',month:'short'})}
function wd(s){return fmt(s,{weekday:'short',day:'numeric',month:'short'})}
function monthLabel(m){return parse(m+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function uid(){return Math.random().toString(36).slice(2,9)}
function daysBetween(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function beltColor(b){return 'var(--belt-'+b+')'}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase()}
function avatar(name,photo,size){
  var s=size||36;
  if(photo&&String(photo).indexOf('data:image/')===0)return '<img class="av" style="width:'+s+'px;height:'+s+'px" src="'+esc(photo)+'" alt="">';
  return '<span class="av init" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.4)+'px" aria-hidden="true">'+esc(initials(name))+'</span>';
}

/* ---------- state ---------- */
function emptyState(){return {v:1,at:0,sample:false,owner:{name:'Sensei',photo:''},sheet:{url:'',token:'',auto:true,last:0},batches:[],students:[],trainers:[],sessions:{},payments:[]}}
function normalize(o){if(!o.payments)o.payments=[];if(!o.owner)o.owner={name:'Sensei',photo:''};if(!o.sheet)o.sheet={url:'',token:''};if(o.sheet.auto==null)o.sheet.auto=true;if(!o.sheet.last)o.sheet.last=0;if(!o.sheet.token)o.sheet.token=secretWord();o.trainers.forEach(function(t){if(t.photo==null)t.photo=''});return o}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  var t=today(),rnd=mulberry(11),S=emptyState();
  S.sample=true;
  S.batches=[
    {id:'b1',village:'Bicholim',time:'18:00',days:[1,3,5]},
    {id:'b2',village:'Mayem',time:'17:30',days:[2,4]},
    {id:'b3',village:'Sanquelim',time:'07:00',days:[6]}
  ];
  S.trainers=[{id:'t1',name:'Rahul Naik',phone:'',rate:300},{id:'t2',name:'Pratik Gawas',phone:'',rate:250}];
  var roster={
    b1:[['Aarav Naik','green','monthly',500,18],['Riya Gawas','yellow','monthly',500,3],['Om Parab','white','monthly',500,-6],['Sneha Shetye','orange','annual',5000,190],['Yash Kerkar','white','monthly',500,11],['Diya Salgaonkar','blue','annual',5000,120]],
    b2:[['Atharv Gaonkar','yellow','monthly',500,25],['Pooja Fal Dessai','white','monthly',500,9],['Kunal Volvoikar','orange','monthly',500,-2],['Isha Redkar','green','monthly',500,14],['Rohan Dhavalikar','white','monthly',500,4]],
    b3:[['Tanvi Sawant','brown','annual',5000,260],['Sarthak Parsekar','white','monthly',500,7],['Mihir Kandolkar','yellow','monthly',500,16],['Anaya Bandekar','white','monthly',500,21]]
  };
  Object.keys(roster).forEach(function(bid){
    roster[bid].forEach(function(r){
      var until=addDays(t,r[4]);
      var sid=uid(),start=addMonths(until,-PLANS[r[2]].months);
      S.students.push({id:sid,batchId:bid,name:r[0],phone:'',belt:r[1],plan:r[2],fee:r[3],start:start,until:until});
      S.payments.push({id:uid(),studentId:sid,batchId:bid,name:r[0],plan:r[2],date:start,amount:r[3]});
    });
  });
  var n=0;
  for(var i=1;i<=28;i++){
    var date=addDays(t,-i),w=parse(date).getDay();
    S.batches.forEach(function(b){
      if(b.days.indexOf(w)<0)return;
      n++;
      var ids=S.students.filter(function(s){return s.batchId===b.id}).filter(function(){return rnd()<0.78}).map(function(s){return s.id});
      var sub=(n%4===3)?S.trainers[n%2]:null;
      S.sessions[date+'|'+b.id]={p:ids,by:sub?sub.id:'me',pay:sub?sub.rate:0,paid:sub?i>9:false};
    });
  }
  return S;
}

function loadLocal(){
  try{var j=localStorage.getItem(KEY);if(j){var o=JSON.parse(j);if(o&&o.batches)return o}}catch(e){}
  return null;
}
var S=loadLocal();
if(S&&S.sample&&!S.payments)S=null;
S=normalize(S||emptyState());
var ui={tab:'classes',batch:null,btab:'students',date:today(),grid:false,month:today().slice(0,7),payMonth:today().slice(0,7),sumMonth:today().slice(0,7),sheet:null,sync:'local'};
function secretWord(){var w=['dojo','kata','kiai','obi','sensei','gi','kumite','mawashi'];return w[Math.floor(Math.random()*w.length)]+'-'+Math.random().toString(36).slice(2,7)}
function addPayment(st,date){S.payments.push({id:uid(),studentId:st.id,batchId:st.batchId,name:st.name,plan:st.plan,date:date,amount:st.fee})}

/* ---------- saving ---------- */
var dbDoc=null,saveTimer=null;
function save(){
  S.at=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){setSync('saving');clearTimeout(saveTimer);saveTimer=setTimeout(pushDb,600)}
  if(sheetReady()&&S.sheet.auto&&!sendingNow){clearTimeout(sheetTimer);sheetTimer=setTimeout(function(){sendSheet(true)},4000)}
}
var sheetTimer=null,sendingNow=false,sheetMsg='';
function sheetReady(){return S.sheet&&S.sheet.url.indexOf('https://script.google.com/')===0&&!!S.sheet.token}
function sendSheet(silent){
  if(!sheetReady())return Promise.resolve(false);
  var body=JSON.stringify({token:S.sheet.token,attendance:attendanceRows(),fees:feesRows(),trainers:trainersRows()});
  sheetMsg='Sending to Google Sheet...';if(!silent)paintSheetMsg(true);
  return fetch(S.sheet.url,{method:'POST',mode:'no-cors',body:body}).then(function(){
    sendingNow=true;S.sheet.last=Date.now();save();sendingNow=false;
    sheetMsg='Sent at '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})+'. Open the sheet to check.';paintSheetMsg(true);if(ui.tab==='settings'&&!ui.batch&&silent)render();return true;
  },function(){
    sheetMsg='Could not reach Google from here. Use the GitHub link or the downloaded file.';paintSheetMsg(false);return false;
  });
}
function paintSheetMsg(ok){var e=$('sheetMsg');if(e){e.textContent=sheetMsg;e.style.color=ok?'var(--ok)':'var(--bad)'}}
function pushDb(){
  if(!dbDoc)return;
  Promise.resolve(dbDoc.set({json:JSON.stringify(S),at:S.at})).then(function(){setSync('saved')},function(){setSync('local')});
}
function setSync(v){
  ui.sync=v;
  var el=$('sync');
  if(el){el.className='sync '+v;el.lastChild.textContent=syncText()}
}
function syncText(){return ui.sync==='saved'?'Saved':ui.sync==='saving'?'Saving':'This device only'}

function connectDb(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('db').then(function(db){
    if(!db)return;
    dbDoc=db.doc('app/state');
    return Promise.resolve(dbDoc.get()).then(function(snap){
      var ex=snap&&(typeof snap.exists==='function'?snap.exists():snap.exists);
      var data=ex?(typeof snap.data==='function'?snap.data():snap):null;
      if(data&&data.json){
        var remote=JSON.parse(data.json);
        if(remote&&remote.batches&&(remote.at||0)>=(S.at||0)){S=normalize(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
      }
      ui.sync='saved';
      render();
    });
  }).catch(function(){ui.sync='local'});
}

/* ---------- queries ---------- */
function batchOf(id){return S.batches.find(function(b){return b.id===id})}
function studentsOf(bid){return S.students.filter(function(s){return s.batchId===bid}).sort(function(a,b){return a.name.localeCompare(b.name)})}
function trainerOf(id){return S.trainers.find(function(t){return t.id===id})}
function sess(bid,date,create){
  var k=date+'|'+bid;
  if(!S.sessions[k]&&create)S.sessions[k]={p:[],by:'me',pay:0,paid:false};
  return S.sessions[k];
}
function status(st){
  var d=daysBetween(st.until,today());
  if(d<0)return {k:'bad',t:'Expired '+(-d)+(d===-1?' day':' days')+' ago',due:true};
  if(d===0)return {k:'warn',t:'Due today',due:true};
  if(d<=5)return {k:'warn',t:'Due in '+d+(d===1?' day':' days'),due:true};
  return {k:'ok',t:'Paid till '+fmt(st.until),due:false};
}
function dueCount(bid){return studentsOf(bid).filter(function(s){return status(s).due}).length}

}

function navHTML(){
  if(ui.batch)return '';

}

  if(ui.batch)return batchHTML(batchOf(ui.batch));
  return ui.tab==='pay'?payHTML():ui.tab==='summary'?sumHTML():ui.tab==='settings'?settingsHTML():classesHTML();
}

/* Classes tab */
function classesHTML(){
  var t=today(),w=parse(t).getDay(),h='';
  if(S.sample)h+='<div class="banner"><span>Sample data. Replace it with your own batches.</span><button class="mini" data-a="clearSample">Clear sample</button></div>';
  var todays=S.batches.filter(function(b){return b.days.indexOf(w)>=0||sess(b.id,t)});
  if(S.batches.length){
    var pres=0,tot=0,done=0,due=S.students.filter(function(s){return status(s).due}).length,owe=0;
    todays.forEach(function(b){var s=sess(b.id,t);tot+=studentsOf(b.id).length;if(s&&(s.p.length||s.by!=='me')){done++;pres+=s.p.length}});
    Object.keys(S.sessions).forEach(function(k){var s=S.sessions[k];if(s.by!=='me'&&!s.paid)owe+=+s.pay||0});
    h+='<div class="hero"><div><small>Present today</small><b>'+pres+'<span>/'+tot+'</span></b></div><div><small>Classes done</small><b>'+done+'<span>/'+todays.length+'</span></b></div><button data-a="tab" data-v="summary"><small>Plans due</small><b class="'+(due?'hot':'')+'">'+due+'</b></button><button data-a="tab" data-v="pay"><small>Owed to trainers</small><b class="'+(owe?'hot':'')+'">'+money(owe)+'</b></button></div>';
    if(!sheetReady())h+='<div class="banner" style="background:var(--accent-soft);color:var(--accent)"><span>Connect your Google Sheet so every change is saved there too.</span><button class="mini" data-a="tab" data-v="settings">Set up</button></div>';
  }
  h+='<section class="sec"><div class="sec-h"><h2>Today</h2><span>'+esc(wd(t))+'</span></div>';
  if(!S.batches.length)h+='<div class="empty">Add your first batch to start taking attendance.<br><button class="mini" style="margin-top:10px" data-a="loadSample">Try with sample data</button></div>';
  else if(!todays.length)h+='<p class="empty">No class scheduled today. Open a batch below to take attendance for any day.</p>';
  else h+='<div class="list">'+todays.map(function(b){return batchCard(b,true)}).join('')+'</div>';
  h+='</section>';
  h+='<section class="sec"><div class="sec-h"><h2>All batches</h2><span>'+S.batches.length+' villages</span></div>';
  if(S.batches.length)h+='<div class="list">'+S.batches.map(function(b){return batchCard(b,false)}).join('')+'</div>';
  h+='<button class="btn block" data-a="addBatch">+ Add batch</button></section>';
  return h;
}
function batchCard(b,isToday){
  var n=studentsOf(b.id).length,s=sess(b.id,today()),taken=s&&(s.p.length||s.by!=='me'),meta,cls='';
  if(isToday){
    if(taken){var tr=s.by!=='me'?trainerOf(s.by):null;meta=s.p.length+' of '+n+' present'+(s.by!=='me'?' · taken by '+(tr?tr.name:'a trainer'):'');cls='done'}
    else{meta='Attendance not taken yet';cls='todo'}
  }else{
    var dc=dueCount(b.id);
    meta=n+(n===1?' student':' students')+(dc?' · '+dc+' plan'+(dc===1?'':'s')+' due':'');
  }
  var chips='<div class="daychips">'+DAYS.map(function(d,i){return b.days.indexOf(i)>=0?'<b class="on">'+d+'</b>':''}).join('')+(b.time?'<b>'+esc(timeText(b.time))+'</b>':'')+'</div>';
  return '<button class="bcard '+cls+'" data-a="open" data-id="'+b.id+'" data-t="'+(isToday?'attendance':'students')+'"><span class="bar"></span><span class="body"><span class="name">'+esc(b.village)+'</span>'+(isToday?'':chips)+'<span class="meta">'+esc(meta)+'</span></span><span class="go" aria-hidden="true">›</span></button>';
}

function instRow(name,photo,sub,act,id){
  return '<div class="row"><button class="row-main" data-a="'+act+'" data-id="'+id+'">'+avatar(name,photo,44)+'<span><span class="name">'+esc(name)+'</span><br><span class="sub">'+esc(sub)+'</span></span></button><button class="mini" data-a="'+act+'" data-id="'+id+'">Edit</button></div>';
}

  h+=instRow(S.owner.name,S.owner.photo,'Head sensei','editOwner','');

}

function attendanceHTML(b){

function dayHTML(b){

    S.trainers.map(function(t){return '<option value="'+t.id+'"'+(by===t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+
    (by!=='me'&&!trainerOf(by)?'<option value="'+esc(by)+'" selected>Former trainer</option>':'')+'</select></label></div>';
  if(by!=='me'){
    h+='<div class="two"><label class="field"><span>Pay for this class (₹)</span><input type="number" inputmode="numeric" min="0" id="payIn" data-c="pay" value="'+(s?s.pay:0)+'"></label>'+
      '<div class="field"><span>Payment</span><button class="btn" data-a="paidtoggle" aria-pressed="'+(!!s.paid)+'" style="'+(s.paid?'color:var(--ok);border-color:var(--ok)':'color:var(--bad);border-color:var(--bad)')+'">'+(s.paid?'Paid':'Not paid yet')+'</button></div></div>';
  }

function gridHTML(b){
  var list=studentsOf(b.id),m=ui.month;

  h+='<div class="gridwrap"><table class="grid"><thead><tr><th scope="col">Student</th>'+keys.map(function(d){return '<th scope="col">'+parse(d).getDate()+'<small>'+DAYS[parse(d).getDay()]+'</small></th>'}).join('')+'<th scope="col">Total</th></tr></thead><tbody>';
  list.forEach(function(st){
    var tot=0;
    h+='<tr><td>'+esc(st.name)+'</td>'+keys.map(function(d){var on=S.sessions[d+'|'+b.id].p.indexOf(st.id)>=0;if(on)tot++;return on?'<td class="y">●</td>':'<td class="n">·</td>'}).join('')+'<td><b>'+tot+'/'+keys.length+'</b></td></tr>';
  });

  return h;

/* Summary tab */
function signed(n){return (n<0?'-':'')+money(Math.abs(n))}
function sumHTML(){
  var m=ui.sumMonth,per={},held=0,pres=0,cap=0,viaTr=0,coll=0,paidTr=0,owedTr=0;
  S.batches.forEach(function(b){per[b.id]={b:b,held:0,pres:0,cap:0,coll:0,cost:0}});
  Object.keys(S.sessions).filter(function(k){return k.indexOf(m)===0}).forEach(function(k){
    var s=S.sessions[k],bid=k.split('|')[1],r=per[bid];
    if(!r||!(s.p.length||s.by!=='me'))return;
    var n=studentsOf(bid).length;
    r.held++;r.pres+=s.p.length;r.cap+=n;held++;pres+=s.p.length;cap+=n;
    if(s.by!=='me'){var c=+s.pay||0;r.cost+=c;viaTr++;if(s.paid)paidTr+=c;else owedTr+=c}
  });
  var pays=S.payments.filter(function(p){return p.date.indexOf(m)===0}).sort(function(a,b){return b.date.localeCompare(a.date)});
  pays.forEach(function(p){coll+=+p.amount||0;if(per[p.batchId])per[p.batchId].coll+=+p.amount||0});
  var cost=paidTr+owedTr;
  function pct(a,b){return b?Math.round(a/b*100)+'%':'–'}
  var h='<div class="datebar"><button class="icon-btn" data-a="sprev" aria-label="Previous month">‹</button><div class="card" style="flex:1;text-align:center;font-weight:700;padding:10px">'+esc(monthLabel(m))+'</div><button class="icon-btn" data-a="snext" aria-label="Next month">›</button></div>';
  h+='<div class="tiles">'+
    '<div class="tile"><small>Fees received</small><b>'+money(coll)+'</b><em>'+pays.length+(pays.length===1?' payment':' payments')+'</em></div>'+
    '<div class="tile owe"><small>Total trainer pay</small><b>'+money(cost)+'</b><em>'+(viaTr?money(paidTr)+' paid · '+money(owedTr)+' to pay':'No substitute classes')+'</em></div>'+
    '<div class="tile"><small>Left after trainer pay</small><b>'+signed(coll-cost)+'</b><em>Fees minus trainer pay</em></div>'+
    '<div class="tile"><small>Attendance</small><b>'+pct(pres,cap)+'</b><em>'+held+(held===1?' class':' classes')+', '+viaTr+' by trainers</em></div></div>';
  h+='<section class="sec"><div class="sec-h"><h2>By batch</h2><span>'+S.batches.length+' villages</span></div>';
  if(!S.batches.length)h+='<p class="empty">Add a batch to see its numbers here.</p>';
  h+=S.batches.map(function(b){
    var r=per[b.id];
    return '<div class="card"><div class="tr-h"><div class="grow"><div class="name" style="font:800 17px/1.2 var(--font-display)">'+esc(b.village)+'</div></div><button class="mini" data-a="openMonth" data-id="'+b.id+'">Month sheet</button></div>'+
      '<div class="stats"><div><small>Classes</small><b>'+r.held+'</b></div><div><small>Attended</small><b>'+pct(r.pres,r.cap)+'</b></div><div><small>Fees</small><b>'+money(r.coll)+'</b></div><div><small>Trainer</small><b>'+money(r.cost)+'</b></div></div></div>';
  }).join('')+'</section>';
  var due=S.students.filter(function(s){return status(s).due}).sort(function(a,b){return a.until.localeCompare(b.until)});
  h+='<section class="sec"><div class="sec-h"><h2>Plans due now</h2><span>'+(due.length?due.length+' to collect, '+money(due.reduce(function(a,s){return a+(+s.fee||0)},0)):'None')+'</span></div>';
  if(!due.length)h+='<p class="empty">Every plan is paid up.</p>';
  else h+='<div class="list">'+due.map(function(s){
    var st=status(s),b=batchOf(s.batchId);

  }).join('')+'</div>';
  h+='</section>';
  h+='<section class="sec"><div class="sec-h"><h2>Fees received</h2><span>'+esc(monthLabel(m))+'</span></div>';
  if(!pays.length)h+='<p class="empty">No fees recorded this month. Renewing a plan records a payment.</p>';

function field(label,id,val,type,extra){return '<label class="field"><span>'+label+'</span><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" '+(extra||'')+'></label>'}

}
function tsvCell(v){var s=String(v==null?'':v).replace(/[\t\r\n]+/g,' ');return /^[=+\-@]/.test(s)?"'"+s:s}
function toTSV(rows){return rows.map(function(r){return r.map(tsvCell).join('\t')}).join('\n')}
function whoTook(id){return id==='me'?S.owner.name:(trainerOf(id)?trainerOf(id).name:'Former trainer')}
function attendanceRows(){
  var rows=[['Date','Village','Student','Present','Taken by']];
  Object.keys(S.sessions).sort().forEach(function(k){
    var p=k.split('|'),s=S.sessions[k],b=batchOf(p[1]);
    if(!b)return;
    studentsOf(b.id).forEach(function(st){rows.push([p[0],b.village,st.name,s.p.indexOf(st.id)>=0?'Yes':'No',whoTook(s.by)])});
  });
  return rows;
}
function feesRows(){
  var rows=[['Date','Student','Village','Plan','Amount']];
  S.payments.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(p){
    var b=batchOf(p.batchId);rows.push([p.date,p.name,b?b.village:'',PLANS[p.plan]?PLANS[p.plan].label:'',p.amount]);
  });
  return rows;
}
function trainersRows(){
  var rows=[['Date','Village','Trainer','Amount','Paid']];
  Object.keys(S.sessions).sort().forEach(function(k){
    var p=k.split('|'),s=S.sessions[k],b=batchOf(p[1]);
    if(s.by==='me')return;
    rows.push([p[0],b?b.village:'',whoTook(s.by),s.pay||0,s.paid?'Yes':'No']);
  });
  return rows;
}
function attendanceTSV(){return toTSV(attendanceRows())}
function feesTSV(){return toTSV(feesRows())}
function trainersTSV(){return toTSV(trainersRows())}
var SHEET_SCRIPT="/**\n * Class Attendance: Google Sheet receiver.\n *\n * Setup: see SETUP.md. Paste this into Extensions > Apps Script of your sheet,\n * change SECRET, then Deploy > New deployment > Web app\n * (Execute as: Me, Who has access: Anyone). Copy the web app link into the app.\n *\n * Each sync from the app rewrites these tabs:\n *   Attendance, Fees, Trainer pay, Summary\n */\nconst SECRET = '__SECRET__';\n\nfunction doGet() {\n  return ContentService.createTextOutput('Class Attendance sheet is ready.');\n}\n\nfunction doPost(e) {\n  let d;\n  try {\n    d = JSON.parse(e.postData.contents);\n  } catch (err) {\n    return ContentService.createTextOutput('bad data');\n  }\n  if (d.token !== SECRET) return ContentService.createTextOutput('denied');\n\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  writeTab_(ss, 'Attendance', d.attendance);\n  writeTab_(ss, 'Fees', d.fees);\n  writeTab_(ss, 'Trainer pay', d.trainers);\n  buildSummary_(ss, d);\n  return ContentService.createTextOutput('ok');\n}\n\n/** Clears a tab and writes header + rows. Dates stay as text (yyyy-mm-dd). */\nfunction writeTab_(ss, name, rows) {\n  const sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clear();\n  if (!rows || !rows.length) return;\n  const width = rows[0].length;\n  sh.getRange(1, 1, rows.length, 1).setNumberFormat('@');\n  const clean = rows.map(function (r) {\n    return r.map(function (v) {\n      return (typeof v === 'string' && /^[=+\\-@]/.test(v)) ? \"'\" + v : v;\n    });\n  });\n  sh.getRange(1, 1, clean.length, width).setValues(clean);\n  sh.getRange(1, 1, 1, width)\n    .setFontWeight('bold').setBackground('#2A2B2F').setFontColor('#FFFFFF');\n  sh.setFrozenRows(1);\n  sh.autoResizeColumns(1, width);\n}\n\n/** Summary tab: type a month like 2026-11 in B1 and everything recalculates. */\nfunction buildSummary_(ss, d) {\n  const sh = ss.getSheetByName('Summary') || ss.insertSheet('Summary');\n  const keepMonth = sh.getRange('B1').getValue();\n  sh.clear();\n  const month = keepMonth ? String(keepMonth) : Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM');\n\n  sh.getRange('A1').setValue('Month (yyyy-mm)');\n  sh.getRange('B1').setNumberFormat('@').setValue(month).setBackground('#F4D9D7').setFontWeight('bold');\n\n  const m = '$B$1&\"*\"';\n  const rows = [\n    ['Fees received', '=SUMIFS(Fees!E:E,Fees!A:A,' + m + ')'],\n    ['Trainer pay, total', \"=SUMIFS('Trainer pay'!D:D,'Trainer pay'!A:A,\" + m + ')'],\n    ['Trainer pay, paid', \"=SUMIFS('Trainer pay'!D:D,'Trainer pay'!A:A,\" + m + \",'Trainer pay'!E:E,\\\"Yes\\\")\"],\n    ['Trainer pay, still to pay', '=B4-B5'],\n    ['Left after trainer pay', '=B3-B4'],\n    ['Classes taken by trainers', \"=COUNTIFS('Trainer pay'!A:A,\" + m + ')'],\n    ['Attendance %', '=IFERROR(COUNTIFS(Attendance!A:A,' + m + ',Attendance!D:D,\"Yes\")/COUNTIFS(Attendance!A:A,' + m + '),0)']\n  ];\n  sh.getRange(3, 1, rows.length, 2).setFormulas(rows);\n  sh.getRange('B3:B8').setNumberFormat('#,##0');\n  sh.getRange('B9').setNumberFormat('0%');\n\n  // By village\n  const villages = unique_(d.attendance, 1);\n  let r = 12;\n  sh.getRange(r, 1, 1, 4).setValues([['Village', 'Attendance %', 'Fees received', 'Trainer pay']]);\n  styleHeader_(sh.getRange(r, 1, 1, 4));\n  villages.forEach(function (v, i) {\n    const row = r + 1 + i;\n    sh.getRange(row, 1).setValue(v);\n    sh.getRange(row, 2).setFormula('=IFERROR(COUNTIFS(Attendance!A:A,' + m + ',Attendance!B:B,A' + row + ',Attendance!D:D,\"Yes\")/COUNTIFS(Attendance!A:A,' + m + ',Attendance!B:B,A' + row + '),0)').setNumberFormat('0%');\n    sh.getRange(row, 3).setFormula('=SUMIFS(Fees!E:E,Fees!A:A,' + m + ',Fees!C:C,A' + row + ')').setNumberFormat('#,##0');\n    sh.getRange(row, 4).setFormula(\"=SUMIFS('Trainer pay'!D:D,'Trainer pay'!A:A,\" + m + \",'Trainer pay'!B:B,A\" + row + ')').setNumberFormat('#,##0');\n  });\n\n  // By trainer: classes x rate = total\n  const trainers = unique_(d.trainers, 2);\n  r = r + villages.length + 3;\n  sh.getRange(r, 1, 1, 5).setValues([['Trainer', 'Classes', 'Total', 'Paid', 'To pay']]);\n  styleHeader_(sh.getRange(r, 1, 1, 5));\n  trainers.forEach(function (t, i) {\n    const row = r + 1 + i;\n    sh.getRange(row, 1).setValue(t);\n    sh.getRange(row, 2).setFormula(\"=COUNTIFS('Trainer pay'!A:A,\" + m + \",'Trainer pay'!C:C,A\" + row + ')');\n    sh.getRange(row, 3).setFormula(\"=SUMIFS('Trainer pay'!D:D,'Trainer pay'!A:A,\" + m + \",'Trainer pay'!C:C,A\" + row + ')').setNumberFormat('#,##0');\n    sh.getRange(row, 4).setFormula(\"=SUMIFS('Trainer pay'!D:D,'Trainer pay'!A:A,\" + m + \",'Trainer pay'!C:C,A\" + row + \",'Trainer pay'!E:E,\\\"Yes\\\")\").setNumberFormat('#,##0');\n    sh.getRange(row, 5).setFormula('=C' + row + '-D' + row).setNumberFormat('#,##0');\n  });\n\n  sh.getRange('A3:A9').setFontWeight('bold');\n  sh.setColumnWidth(1, 200);\n  sh.setActiveSheet(sh);\n}\n\nfunction unique_(rows, col) {\n  const seen = {};\n  const out = [];\n  (rows || []).slice(1).forEach(function (r) {\n    const v = r[col];\n    if (v && !seen[v]) { seen[v] = true; out.push(v); }\n  });\n  return out;\n}\n\nfunction styleHeader_(range) {\n  range.setFontWeight('bold').setBackground('#2A2B2F').setFontColor('#FFFFFF');\n}\n";

function say(m,ok){var e=$('err');if(e){e.textContent=m;e.style.color=ok?'var(--ok)':''}}
function err(m){say(m,false)}

/* ---------- render ---------- */
function render(){
  var m=$('main'),top=m?m.scrollTop:0;
  $('app').innerHTML=headerHTML()+'<main id="main">'+bodyHTML()+'</main>'+navHTML();
  $('main').scrollTop=top;
}

/* ---------- actions ---------- */
var A={
  tab:function(d){ui.tab=d.v;ui.batch=null;render()},
  open:function(d){ui.batch=d.id;ui.btab=d.t||'students';ui.date=today();ui.grid=false;ui.month=today().slice(0,7);render();$('main').scrollTop=0},
  back:function(){ui.batch=null;render()},
  btab:function(d){ui.btab=d.v;render()},
  gridmode:function(d){ui.grid=d.v==='month';if(ui.grid)ui.month=ui.date.slice(0,7);render()},
  dprev:function(){ui.date=addDays(ui.date,-1);render()},
  dnext:function(){ui.date=addDays(ui.date,1);render()},
  gotoday:function(){ui.date=today();render()},
  mprev:function(){ui.month=shiftMonth(ui.month,-1);render()},
  mnext:function(){ui.month=shiftMonth(ui.month,1);render()},
  sprev:function(){ui.sumMonth=shiftMonth(ui.sumMonth,-1);render()},
  snext:function(){ui.sumMonth=shiftMonth(ui.sumMonth,1);render()},
  openMonth:function(d){ui.batch=d.id;ui.btab='attendance';ui.grid=true;ui.month=ui.sumMonth;ui.date=today();render();$('main').scrollTop=0},
  gotopay:function(){ui.payMonth=ui.sumMonth;ui.tab='pay';render();$('main').scrollTop=0},
  pprev:function(){ui.payMonth=shiftMonth(ui.payMonth,-1);render()},
  pnext:function(){ui.payMonth=shiftMonth(ui.payMonth,1);render()},
  tog:function(d){
    var s=sess(ui.batch,ui.date,true),i=s.p.indexOf(d.id);
    if(i>=0)s.p.splice(i,1);else s.p.push(d.id);
    save();render();
  },
  allpresent:function(){var s=sess(ui.batch,ui.date,true);s.p=studentsOf(ui.batch).map(function(x){return x.id});save();render()},
  clearall:function(){var s=sess(ui.batch,ui.date,true);s.p=[];save();render()},
  paidtoggle:function(){var s=sess(ui.batch,ui.date,true);s.paid=!s.paid;save();render()},
  payone:function(d){var s=S.sessions[d.k];if(s){s.paid=!s.paid;save();render()}},
  payall:function(d){payRows(ui.payMonth).forEach(function(r){if(r.s.by===d.id)r.s.paid=true});save();render()},
  renew:function(d){
    var st=S.students.find(function(x){return x.id===d.id});if(!st)return;
    var base=daysBetween(st.until,today())>0?st.until:today();
    st.until=addMonths(base,PLANS[st.plan].months);addPayment(st,today());save();render();
  },
  clearSample:function(){S=emptyState();save();render()},
  addBatch:function(){openSheet('batch')},
  editBatch:function(d){openSheet('batch',d.id)},
  addStudent:function(){openSheet('student')},
  editStudent:function(d){openSheet('student',d.id)},
  addTrainer:function(){openSheet('trainer')},
  editTrainer:function(d){openSheet('trainer',d.id)},
  editOwner:function(){openSheet('owner')},
  loadSample:function(){S=normalize(seed());save();render()},
  rmPhoto:function(){ui.sheet.photo='';var p=$('photoPrev');if(p)p.innerHTML=avatar(val('f-name'),'',64)},
  exportData:function(d){var e=EXPORTS[d.v];if(!e)return;ui.sheet={kind:'export',title:e[0],help:e[1],text:e[2]()};renderSheet()},
  openRestore:function(){ui.sheet={kind:'restore'};renderSheet()},
  openSync:function(){ui.tab='settings';ui.batch=null;render()},
  copyScript:function(){
    var tok=val('f-token').trim()||S.sheet.token;S.sheet.token=tok;save();
    ui.sheet={kind:'export',title:'Google Sheet script',help:'Copy all of this and paste it into Extensions \u203A Apps Script in your sheet. Secret word: '+tok,text:SHEET_SCRIPT.replace('__SECRET__',tok.replace(/[\\']/g,''))};renderSheet();
  },
  connectSheet:function(){
    var url=val('f-url').trim(),tok=val('f-token').trim();
    function m(t){sheetMsg=t;paintSheetMsg(false)}
    if(url.indexOf('https://script.google.com/')!==0)return m('Paste the Web app link. It starts with https://script.google.com/');
    if(!/\/exec$/.test(url.split('?')[0]))return m('Use the Web app link that ends in /exec, not the editor link.');
    if(!tok)return m('Enter the secret word that is in your script.');
    S.sheet.url=url;S.sheet.token=tok.replace(/[\\']/g,'');sendingNow=true;save();sendingNow=false;
    sendSheet(false).then(function(){render()});
  },
  disconnectSheet:function(){S.sheet.url='';sheetMsg='';sendingNow=true;save();sendingNow=false;render()},
  doSync:function(){
    var url=val('f-url').trim(),token=val('f-token').trim();
    if(url.indexOf('https://script.google.com/')!==0)return err('Paste the web app link. It starts with https://script.google.com/');
    if(!token)return err('Enter the secret word you set in the script.');
    S.sheet={url:url,token:token};save();
    var body=JSON.stringify({token:token,attendance:attendanceRows(),fees:feesRows(),trainers:trainersRows()});
    say('Sending...',true);
    fetch(url,{method:'POST',mode:'no-cors',body:body}).then(function(){
      say('Sent. Open your sheet in a few seconds to see the tabs. If nothing changes, check the secret word.',true);
    },function(){
      err('This page cannot reach Google here. Open the downloaded file or the GitHub link and try again.');
    });
  },
  copyText:function(){
    var t=$('f-text');if(!t)return;
    t.focus();t.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(function(){say('Copied. Paste it into your sheet.',true)},function(){say('Copy was blocked. The text is selected, so copy it by hand.',false)});
    }else say('The text is selected. Copy it by hand.',false);
  },
  doRestore:function(){
    var t=$('f-text'),o;
    try{o=JSON.parse(t.value)}catch(e){return err('That is not a valid backup. Copy the whole backup text and try again.')}
    if(!o||!Array.isArray(o.batches)||!Array.isArray(o.students)||!Array.isArray(o.trainers)||typeof o.sessions!=='object'||!o.sessions)return err('That text is not a backup from this app.');
    S=normalize(o);save();closeSheet();render();
  },
  closeSheet:closeSheet,
  askDelete:function(){ui.sheet.confirm=true;renderSheet()},
  noDelete:function(){ui.sheet.confirm=false;renderSheet()},
  doDelete:function(){
    var sh=ui.sheet;
    if(sh.kind==='batch'){
      S.batches=S.batches.filter(function(b){return b.id!==sh.id});
      S.students=S.students.filter(function(s){return s.batchId!==sh.id});
      S.payments=S.payments.filter(function(p){return p.batchId!==sh.id});
      Object.keys(S.sessions).forEach(function(k){if(k.slice(-(sh.id.length+1))==='|'+sh.id)delete S.sessions[k]});
      ui.batch=null;
    }else if(sh.kind==='student'){
      S.students=S.students.filter(function(s){return s.id!==sh.id});
      Object.keys(S.sessions).forEach(function(k){var p=S.sessions[k].p,i=p.indexOf(sh.id);if(i>=0)p.splice(i,1)});
    }else{
      S.trainers=S.trainers.filter(function(t){return t.id!==sh.id});
    }
    save();closeSheet();render();
  },
  saveSheet:function(){
    var sh=ui.sheet,ed;
    if(sh.kind==='batch'){
      var v=val('f-village').trim(),days=[].slice.call(document.querySelectorAll('input[name=day]:checked')).map(function(i){return +i.value});
      if(!v)return err('Enter the village name.');
      if(!days.length)return err('Pick at least one class day. You can still take attendance on other days.');
      ed=sh.id?batchOf(sh.id):null;
      if(ed){ed.village=v;ed.days=days;ed.time=val('f-time')}
      else{var nb={id:uid(),village:v,days:days,time:val('f-time')};S.batches.push(nb)}
    }else if(sh.kind==='student'){
      var nm=val('f-name').trim();if(!nm)return err('Enter the student’s name.');
      var fee=Math.max(0,+val('f-fee')||0),plan=val('f-plan');
      ed=sh.id?S.students.find(function(s){return s.id===sh.id}):null;
      if(ed){ed.name=nm;ed.phone=val('f-phone').trim();ed.belt=val('f-belt');ed.plan=plan;ed.fee=fee;if(val('f-until'))ed.until=val('f-until')}
      else{
        var start=val('f-start')||today();
        var ns={id:uid(),batchId:ui.batch,name:nm,phone:val('f-phone').trim(),belt:val('f-belt'),plan:plan,fee:fee,start:start,until:addMonths(start,PLANS[plan].months)};
        S.students.push(ns);
        if(val('f-paid')==='yes')addPayment(ns,start);
      }
    }else if(sh.kind==='owner'){
      var on=val('f-name').trim();if(!on)return err('Enter your name.');
      S.owner.name=on;if(sh.photo!==undefined)S.owner.photo=sh.photo;
    }else{
      var tn=val('f-name').trim();if(!tn)return err('Enter the trainer’s name.');
      var rate=Math.max(0,+val('f-rate')||0);
      ed=sh.id?trainerOf(sh.id):null;
      if(ed){ed.name=tn;ed.phone=val('f-phone').trim();ed.rate=rate;if(sh.photo!==undefined)ed.photo=sh.photo}
      else S.trainers.push({id:uid(),name:tn,phone:val('f-phone').trim(),rate:rate,photo:sh.photo||''});
    }
    save();closeSheet();render();
  }
};
var C={
  auto:function(el){S.sheet.auto=el.checked;sendingNow=true;save();sendingNow=false},
  photo:function(el){
    var f=el.files&&el.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){err('Pick an image file.');return}
    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      var n=256,c=document.createElement('canvas');c.width=n;c.height=n;
      var s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
      c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,n,n);
      URL.revokeObjectURL(url);
      var d=c.toDataURL('image/jpeg',0.82);
      if(ui.sheet)ui.sheet.photo=d;
      var p=$('photoPrev');if(p)p.innerHTML=avatar(val('f-name'),d,64);
      err('');
    };
    img.onerror=function(){URL.revokeObjectURL(url);err('That photo could not be read. Try another one.')};
    img.src=url;
  },
  date:function(el){if(el.value){ui.date=el.value;render()}},
  by:function(el){
    var s=sess(ui.batch,ui.date,true);s.by=el.value;
    var t=trainerOf(el.value);s.pay=t?t.rate:0;s.paid=false;
    save();render();
  },
  pay:function(el){var s=sess(ui.batch,ui.date,true);s.pay=Math.max(0,+el.value||0);save();render()},
  plan:function(el){
    var f=$('f-fee'),v=+f.value;
    if(!v||v===PLANS.monthly.fee||v===PLANS.annual.fee)f.value=PLANS[el.value].fee;
  }
};

document.addEventListener('click',function(e){
  var sc=$('sheet');
  if(e.target===sc){closeSheet();return}
  var el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,e);
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-c]');
  if(el&&C[el.dataset.c])C[el.dataset.c](el);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet()});

render();
connectDb();
})();
</script>
</body>
</html>
